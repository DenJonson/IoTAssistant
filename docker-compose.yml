services:
  web:
    image: nginx:alpine
    ports:
      - "${API_PORT:-8080}:80"

  client:
    image: curlimages/curl:8.10.1
    command: [ "sleep", "3600" ]

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
