services:
  worker:
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_PREFIX: home/iot/v1
      MQTT_CLIENT_ID: iot-worker-dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-iot_dev_password}@db:5432/${POSTGRES_DB:-iot}
    depends_on:
      - db
      - mosquitto

  api:
    build:
      context: ./backend
      dockerfile: api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-iot_dev_password}@db:5432/${POSTGRES_DB:-iot}
    depends_on:
      - db
    ports:
      - "${API_PORT:-8000}:8000"

  client:
    image: curlimages/curl:8.10.1
    command: [ "sleep", "3600" ]

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t 'healthcheck/mosquitto' -C 1 -W 2 >/tmp/mqtt_health.out 2>/dev/null & pid=$$!; sleep 0.2; mosquitto_pub -h localhost -p 1883 -t 'healthcheck/mosquitto' -m 'ping' >/dev/null 2>&1; wait $$pid" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: tools/migrator/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-iot_dev_password}@db:5432/${POSTGRES_DB:-iot}
    depends_on:
      - db
    restart: "no"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot}
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot} -d ${POSTGRES_DB:-iot} -h localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # Отладка
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      - api
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data/homeassistant/config:/config
    environment:
      TZ: ${TZ:-Europe/Moscow}
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5).read()\"" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
  ha_worker:
    build:
      context: .
      dockerfile: backend/ha-worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-iot_dev_password}@db:5432/${POSTGRES_DB:-iot}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-http://host.docker.internal:8123}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN}
      HOME_ASSISTANT_SYNC_LIMIT: ${HOME_ASSISTANT_SYNC_LIMIT:-500}
      HOME_ASSISTANT_ALLOWED_DOMAINS: ${HOME_ASSISTANT_ALLOWED_DOMAINS:-sensor,binary_sensor,sun,zone,person,light,switch,climate,cover,lock,fan}
      HOME_ASSISTANT_EXCLUDED_ENTITY_PREFIXES: ${HOME_ASSISTANT_EXCLUDED_ENTITY_PREFIXES:-sensor.backup_,sensor.sun_,sun.,zone.,person.,conversation.,event.}
    depends_on:
      db:
        condition: service_started
      homeassistant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mosquitto_data:
  mosquitto_log:
  db_data:
